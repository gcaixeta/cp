version: '3.8'

services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: cpsystem-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cobranca}
      POSTGRES_USER: ${POSTGRES_USER:-gustavo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-139150}
    # Removido a exposição da porta 5432 para evitar ataques externos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cpsystem-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gustavo} -d ${POSTGRES_DB:-cobranca}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cpsystem-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/cobranca}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-gustavo}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-139150}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m -Xms256m}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://cpassessoriaecobranca.com,https://www.cpassessoriaecobranca.com,http://localhost:3000,http://localhost}
      # Authentication variables
      AUTH_USER_EMAIL: ${AUTH_USER_EMAIL:-admin@example.com}
      AUTH_USER_PASSWORD: ${AUTH_USER_PASSWORD:-admin123}
      # JWT variables
      JWT_SECRET: ${JWT_SECRET:-default_secret_key_change_in_production_minimum_32_characters}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cpsystem-network
    restart: unless-stopped
    # Não expor porta diretamente, apenas via Nginx

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Passar variável para o build (necessário para NEXT_PUBLIC_*)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: cpsystem-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    depends_on:
      - backend
    networks:
      - cpsystem-network
    restart: unless-stopped
    # Não expor porta diretamente, apenas via Nginx

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: cpsystem-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cpsystem-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Loki - armazenamento e indexação de logs
  loki:
    image: grafana/loki:2.9.10
    container_name: cpsystem-loki
    command: -config.file=/etc/loki/loki-config.yaml -config.expand-env=true
    environment:
      LOKI_RETENTION_DAYS: ${LOKI_RETENTION_DAYS:-30}
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - cpsystem-network
    restart: unless-stopped

  # Promtail - coleta os logs de todos os containers (via Docker socket) e envia ao Loki
  promtail:
    image: grafana/promtail:2.9.10
    container_name: cpsystem-promtail
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - cpsystem-network
    restart: unless-stopped

  # Grafana - consulta e visualização dos logs (LogQL)
  grafana:
    image: grafana/grafana:11.4.0
    container_name: cpsystem-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    # Publicado só em localhost: acesse via túnel SSH
    # (ssh -L 3001:localhost:3001 usuario@vps), nunca exposto publicamente.
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - cpsystem-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local

networks:
  cpsystem-network:
    driver: bridge
